name: Release

# Auf einem Tag vX.Y.Z das Jar bauen und als Entwurf eines GitHub-Releases
# ablegen, mit SHA256SUMS und den Notizen aus CHANGELOG.md. Ändert eine PR
# diese Datei, die Notizen oder den Build, baut sie das Jar ohne Entwurf.
# Siehe docs/entwicklung.md, „Release“.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", ".github/notizen.sh", "CHANGELOG.md", "build.gradle.kts", "gradle.properties"]

# Nur der Job, der den Entwurf anlegt, darf schreiben.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  jar:
    name: Jar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Die Version steht in gradle.properties; ein Tag muss sie nennen. Die Notizen
      # gleich hier: Fehlt der Abschnitt in CHANGELOG.md, fällt der Lauf vor dem Bauen.
      - name: Version und Notizen
        run: |
          version=$(sed -n 's/^version=\([^[:space:]]*\).*/\1/p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::gradle.properties nennt keine Version wie 1.2.3: $version"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Der Tag $GITHUB_REF_NAME passt nicht zu version=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bash .github/notizen.sh "$version"

      - name: Bauen und Tests
        timeout-minutes: 20
        run: ./gradlew build --console=plain

      # Das Jar nennt in fabric.mod.json dieselbe Version und trägt LICENSE und NOTICE unter META-INF.
      - name: Prüfen
        run: |
          jar=build/libs/heroic-map-renderer-mod-$VERSION.jar
          test -f "$jar" || { echo "::error::$jar fehlt"; exit 1; }
          test "$(unzip -p "$jar" fabric.mod.json | jq -r .version)" = "$VERSION" \
            || { echo "::error::fabric.mod.json in $jar nennt nicht die Version $VERSION"; exit 1; }
          for datei in LICENSE NOTICE; do
            unzip -Z1 "$jar" | grep -qx "META-INF/$datei" || { echo "::error::$jar trägt kein META-INF/$datei"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/heroic-map-renderer-mod-${{ env.VERSION }}.jar
          if-no-files-found: error

  release:
    name: Release-Entwurf
    needs: jar
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: dist

      - name: Prüfsummen
        run: |
          test "$(ls dist/*.jar | wc -l)" -eq 1 || { echo "::error::erwartet genau ein Jar"; exit 1; }
          cd dist && sha256sum *.jar > SHA256SUMS && cat SHA256SUMS

      # Nur ein Entwurf: Veröffentlichen tut der Mod-Programmierer von Hand; erst
      # das veröffentlichte Release lädt modrinth.yml hoch.
      - name: Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/notizen.sh "${GITHUB_REF_NAME#v}" > notizen.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$GITHUB_REF_NAME" --notes-file notizen.md dist/*.jar dist/SHA256SUMS
