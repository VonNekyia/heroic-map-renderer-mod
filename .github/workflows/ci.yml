name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gradle:
    name: Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Prüft auch, dass gradle-wrapper.jar ein Wrapper von Gradle ist.
      - uses: gradle/actions/setup-gradle@v6

      # Die Gametests hier nur kompiliert, so fällt ein Fehler im Code der Szenen schon hier auf; laufen tun sie im Job Gametests.
      - name: Bauen und testen
        timeout-minutes: 20
        run: ./gradlew build compileGametestJava

  # Die Gametests im Spiel, ohne und mit Sodium wie im Modpack. Siehe docs/entscheidungen/0017-gametests-in-der-ci-auch-mit-sodium.md.
  gametests:
    name: Gametests (${{ matrix.mods }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mods: [ohne, sodium]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Ein Fenster ohne Bildschirm: Xvfb, OpenGL in Software über Mesa (llvmpipe), der Kontext über EGL.
      - name: Xvfb und Mesa
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libegl1

      # 24 Bit Farbtiefe; mit der Vorgabe von xvfb-run, 8 Bit, gibt es kein OpenGL. Über GLX fand SDL3 unter Xvfb kein
      # Visual für das Fenster des Spiels, SDL_VIDEO_FORCE_EGL nimmt EGL. Ohne Backend zeigt das Spiel einen Dialog und
      # wartet auf einen Klick, der hier nie kommt: Dann bricht der Schritt gleich ab, statt bis zum Limit zu hängen.
      # Ein Lauf dauert gut 3 min, das Limit lässt Raum für einen langsamen Runner. Siehe docs/entwicklung.md, „CI“.
      - name: Gametests
        timeout-minutes: 10
        env:
          SDL_VIDEO_FORCE_EGL: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest ${{ matrix.mods == 'sodium' && '-Psodium' || '' }} &
          lauf=$!
          while kill -0 "$lauf" 2>/dev/null; do
            n=$(grep -c 'Failed to create backend' build/run/clientGameTest/logs/latest.log 2>/dev/null) || n=0
            if [ "$n" -ge 2 ]; then
              echo "::error::Weder OpenGL noch Vulkan liess sich starten, siehe das Log im Artefakt"
              pkill -f devlaunchinjector || true
              wait "$lauf" || true
              exit 1
            fi
            sleep 5
          done
          wait "$lauf"

      - name: Log und Bildschirmfotos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametests-${{ matrix.mods }}
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
          if-no-files-found: ignore

  doku:
    name: Doku
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Die Prüfung des Hauptrepositorys, damit es sie nur einmal gibt.
      # shell: bash setzt pipefail: Scheitert curl, scheitert der Schritt,
      # statt dass bash eine leere Eingabe grün prüft.
      - name: Verweise, Links und Frontmatter
        timeout-minutes: 5
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/VonNekyia/heroic-map-renderer/master/.github/pruefe-doku.sh | bash

      # Ein Merge, dessen Konflikt nicht gelöst ist, lässt Marken stehen; keine Datei darf eine tragen.
      - name: Keine Konfliktmarken
        timeout-minutes: 5
        shell: bash
        run: "! git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- ."
